<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Undertow — North American tides</title>
<meta name="description" content="Watch the tides of North America breathe in real time. Data from NOAA CO-OPS.">
<style>
  :root {
    --bg: #070d18;
    --ink: #dce6f5;
    --muted: #7f91ab;
    --line: rgba(140,170,210,0.18);
    --accent: #7fd4c8;
    --rose: #ff8fb0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
  }
  header {
    position: absolute; top: 0; left: 0; right: 0;
    z-index: 3;
    padding: 18px 22px 0;
    pointer-events: none;
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 12px;
  }
  .title h1 {
    margin: 0;
    font-weight: 400;
    letter-spacing: 0.28em;
    font-size: clamp(14px, 2.4vw, 18px);
    text-transform: uppercase;
  }
  .title p {
    margin: 6px 0 0;
    max-width: 42ch;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.45;
    letter-spacing: 0.01em;
  }
  .badges {
    display: flex; gap: 8px; flex-wrap: wrap;
    pointer-events: auto;
    justify-content: flex-end;
  }
  .badge {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(8,14,24,0.55);
    backdrop-filter: blur(8px);
    color: var(--muted);
  }
  .badge[data-mode="live"] {
    color: var(--accent);
    border-color: rgba(127,212,200,0.35);
  }
  canvas {
    flex: 1;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
  }
  #controls {
    position: absolute; left: 0; right: 0; bottom: 0;
    z-index: 3;
    padding: 14px 18px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(4,8,16,0.92), rgba(4,8,16,0.55), transparent);
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px 14px;
    align-items: center;
  }
  .btn {
    appearance: none;
    border: 1px solid var(--line);
    background: rgba(16,24,40,0.7);
    color: var(--ink);
    border-radius: 999px;
    padding: 8px 14px;
    font: inherit;
    font-size: 13px;
    letter-spacing: 0.06em;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  .btn:hover { border-color: rgba(180,200,230,0.4); }
  .btn[aria-pressed="true"] {
    border-color: rgba(127,212,200,0.45);
    color: var(--accent);
  }
  #scrub {
    width: 100%;
    accent-color: var(--accent);
    height: 28px;
  }
  #timeLabel {
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.04em;
    min-width: 11.5em;
    text-align: right;
  }
  .legend {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .swatches { display: flex; gap: 14px; align-items: center; }
  .sw { display: inline-flex; align-items: center; gap: 6px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    box-shadow: 0 0 8px currentColor;
  }
  .dot.rise { background: #4edcc8; color: #4edcc8; }
  .dot.fall { background: #ff8fb0; color: #ff8fb0; }
  #tip {
    position: fixed;
    z-index: 5;
    pointer-events: none;
    transform: translate(-50%, -110%);
    background: rgba(8,14,24,0.88);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    min-width: 180px;
    max-width: 260px;
    opacity: 0;
    transition: opacity 0.15s ease;
    backdrop-filter: blur(10px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  #tip.show { opacity: 1; }
  #tip strong {
    display: block;
    font-weight: 500;
    font-size: 13px;
    margin-bottom: 4px;
  }
  #tip .meta {
    display: block;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.4;
  }
  #credit {
    opacity: 0.85;
  }
  @media (max-width: 640px) {
    header { padding: 14px 14px 0; flex-direction: column; align-items: flex-start; }
    .title p { font-size: 12px; max-width: 36ch; }
    #controls {
      grid-template-columns: auto 1fr;
      padding: 12px 12px calc(14px + env(safe-area-inset-bottom));
    }
    #timeLabel { grid-column: 1 / -1; text-align: left; min-width: 0; }
    .legend { font-size: 10px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="title">
      <h1>Undertow</h1>
      <p>The tides of North America, breathing. Each glow is a NOAA station — watch the wave travel the coasts.</p>
    </div>
    <div class="badges">
      <span class="badge" id="mode" data-mode="snapshot">snapshot</span>
      <span class="badge" id="status">loading…</span>
    </div>
  </header>
  <canvas id="c" aria-label="Animated tide field across North America"></canvas>
  <div id="controls">
    <button class="btn" id="play" aria-pressed="true">Pause</button>
    <input id="scrub" type="range" min="0" max="100" value="0" aria-label="Time scrubber">
    <span id="timeLabel">—</span>
    <div class="legend">
      <div class="swatches">
        <span class="sw"><span class="dot rise"></span> rising</span>
        <span class="sw"><span class="dot fall"></span> falling</span>
        <button class="btn" id="sound" aria-pressed="false" style="padding:5px 10px;font-size:11px">Sound</button>
      </div>
      <span id="credit">Data: NOAA CO-OPS · heights in meters above MLLW</span>
    </div>
  </div>
</div>
<div id="tip" role="tooltip"></div>
<script src="undertow.js"></script>
</body>
</html>
